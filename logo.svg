<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ZOMBIE Coin logo -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7bd88f"/>
      <stop offset="55%" stop-color="#3fae5a"/>
      <stop offset="100%" stop-color="#1d5c30"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#c9e8a0" stop-opacity="0"/>
      <stop offset="96%" stop-color="#dff5b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2c7a42"/>
    </radialGradient>
  </defs>

  <!-- coin body -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="248" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#0e3a1e" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="4 10"/>

  <!-- zombie face -->
  <!-- head -->
  <path d="M150 220 Q150 120 256 120 Q362 120 362 220 L362 280 Q362 400 256 400 Q150 400 150 280 Z"
        fill="#8fd98f" stroke="#0e3a1e" stroke-width="10"/>

  <!-- scar stitch -->
  <path d="M300 140 L285 185 M292 150 L305 158 M296 165 L309 173" stroke="#0e3a1e" stroke-width="7" stroke-linecap="round"/>

  <!-- eyes: left X, right wide -->
  <g stroke="#0e3a1e" stroke-width="14" stroke-linecap="round">
    <line x1="185" y1="225" x2="225" y2="265"/>
    <line x1="225" y1="225" x2="185" y2="265"/>
  </g>
  <circle cx="300" cy="245" r="34" fill="#fff"/>
  <circle cx="305" cy="248" r="16" fill="#0e3a1e"/>

  <!-- mouth: jagged -->
  <path d="M190 320 L215 300 L235 325 L256 302 L277 325 L297 300 L322 320 L305 355 L256 368 L207 355 Z"
        fill="#0e3a1e"/>
  <g fill="#fff">
    <rect x="205" y="318" width="16" height="14" rx="3"/>
    <rect x="248" y="322" width="16" height="14" rx="3"/>
    <rect x="291" y="318" width="16" height="14" rx="3"/>
  </g>

  <!-- exposed brain bump -->
  <path d="M235 122 Q256 100 277 122 Q270 132 256 128 Q242 132 235 122" fill="#e8b7d0" stroke="#0e3a1e" stroke-width="7"/>

  <!-- text -->
  <text x="256" y="470" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900"
        text-anchor="middle" fill="#dff5b8" stroke="#0e3a1e" stroke-width="3" paint-order="stroke"
        letter-spacing="6">ZOMBIE</text>
</svg>
